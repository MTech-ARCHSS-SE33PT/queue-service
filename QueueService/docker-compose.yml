services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  queueservice:
    build: .
    ports:
      - "5000:8080"
    depends_on:
      - redis
    env_file:
      - ../.env
    environment:
      - ConnectionStrings__Redis=redis:6379
      # Optional: Azure Service Bus integration
      # - ServiceBus__ConnectionString=${ASB_CONN}
      # - ServiceBus__Topic=queuex.events
      # - ServiceBus__Subscription=queue-service
